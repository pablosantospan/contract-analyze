<div
  class="upload-zone"
  [class.drag-over]="isDragOver()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
>
  <div class="upload-icon">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="12" y1="18" x2="12" y2="12"/>
      <line x1="9" y1="15" x2="15" y2="15"/>
    </svg>
  </div>

  <h2>Sube tu contrato de alquiler</h2>
  <p class="subtitle">Arrastra el PDF aquí o haz clic para seleccionarlo</p>

  <label class="upload-btn">
    Seleccionar PDF
    <input type="file" accept=".pdf,application/pdf" (change)="onFileInput($event)" hidden>
  </label>

  <p class="hint">Solo PDF con texto · Máx. 10 MB</p>

  @if (error()) {
    <p class="error-msg">{{ error() }}</p>
  }
</div>
